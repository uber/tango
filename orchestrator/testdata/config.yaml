repository:
  - remote: "git@github:uber/tango"
    full_hash_repos:
      - "//"
      - "//external"
    excluded_files:
      - "*.gen.go"
    exclude_external_targets: true
    bzlmod_enabled: true
    query_timeout_seconds: 15

service:
  max_worker_pool_size: 3
  workspaces_root_path: "/tmp/tango-repo-manager"
